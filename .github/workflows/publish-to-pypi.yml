name: Publish to PyPI

on:
  release:
    types: [published] # Triggers when you click "Publish Release" on GitHub

jobs:
  build-and-publish:
    name: Build and publish Python distribution to PyPI
    # Only run if the release target is the 'main' branch
    if: github.event.release.target_commitish == 'pip'
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build

    - name: Build binary wheels and source tarball
      run: python -m build

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
